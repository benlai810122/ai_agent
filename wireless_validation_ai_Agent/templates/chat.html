<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireless Validation AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<canvas id="hex-canvas"></canvas>
<div class="scan-line" id="scan-line"></div>

<div class="hero-header">
    <div class="hero-logo-ring">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="#0071c5" stroke-width="2" fill="none" opacity="0.9"/>
            <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" stroke="#00c7fd" stroke-width="1" fill="rgba(0,113,197,0.08)"/>
            <text x="32" y="37" text-anchor="middle" font-size="18" font-weight="bold" fill="#00c7fd" font-family="monospace">AI</text>
        </svg>
    </div>
    <div class="hero-text">
        <h1 class="hero-title">Wireless Validation AI Agent</h1>
        <p class="hero-subtitle">Autonomous Hardware Validation Platform &nbsp;&bull;&nbsp; Powered by Claude</p>
    </div>
    <div class="hero-indicators">
        <span class="hero-dot" id="hero-dot"></span>
        <span class="hero-dot-label" id="hero-dot-label">IDLE</span>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-9">
            <div class="card hud-card shadow">
                <div class="card-header hud-header text-center">
                    <span class="hud-header-label">Chat Console</span>
                </div>
                <div class="card-body chat-body" id="chat-body">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="card-footer">
                    <div class="timeline-wrapper mb-3">
                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#timeline-collapse" aria-expanded="false" aria-controls="timeline-collapse">
                            Toggle Test Timeline
                        </button>
                        <div class="collapse mt-2" id="timeline-collapse">
                            <div class="timeline-panel">
                                <div class="timeline-header">
                                    <div class="timeline-title">Recent Test Runs</div>
                                    <button type="button" class="btn btn-sm btn-light" id="timeline-refresh">Refresh</button>
                                </div>
                                <div id="timeline-empty" class="timeline-empty d-none">No test runs yet.</div>
                                <div id="timeline-list"></div>
                            </div>
                        </div>
                    </div>
                    <div id="agent-status" class="agent-status d-none" aria-live="polite">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        <span>Agent is running tools and preparing a response. This may take a while.</span>
                    </div>
                    <form id="chat-form" class="d-flex flex-column gap-2">
                        <div class="d-flex gap-2">
                            <input type="text" id="user-input" class="form-control" placeholder="Type your message..." autocomplete="off">
                            <button class="btn btn-primary" id="send-button" type="submit">Send</button>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <span class="small fw-semibold">Upload File:</span>
                            <input type="file" id="txt-file-input" accept=".txt,text/plain" class="form-control form-control-sm" style="max-width: 320px;">
                            <span id="txt-file-name" class="small text-muted">No file selected</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
$(function() {
    function escapeHtml(text) {
        return text
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function renderMessageContent(sender, text) {
        if (sender === 'You') {
            return `<p>${escapeHtml(text)}</p>`;
        }

        const markdownHtml = marked.parse(text || '', {
            breaks: true,
            gfm: true,
        });
        return DOMPurify.sanitize(markdownHtml);
    }

    function appendMessage(sender, text) {
        const isUser = sender === 'You';
        const align = isUser ? 'justify-content-end' : 'justify-content-start';
        const bubbleClass = isUser ? 'user-bubble' : 'agent-bubble';
        const contentHtml = renderMessageContent(sender, text);
        $('#chat-body').append(
            `<div class="message-row d-flex ${align}">
                <div class="message-bubble ${bubbleClass}">
                    <div class="message-sender">${sender}</div>
                    <div class="message-content">${contentHtml}</div>
                </div>
            </div>`
        );
        $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);
    }

    function setPendingState(isPending) {
        $('#user-input').prop('disabled', isPending);
        $('#send-button').prop('disabled', isPending);
        $('#txt-file-input').prop('disabled', isPending);
        $('#agent-status').toggleClass('d-none', !isPending);
        $('body').toggleClass('agent-running', isPending);
        $('#scan-line').toggleClass('active', isPending);
        $('#hero-dot').toggleClass('dot-running', isPending);
        $('#hero-dot-label').text(isPending ? 'RUNNING TEST' : 'IDLE');
        if (!isPending) {
            $('#user-input').focus();
        }
    }

    function addWorkingIndicator() {
        const indicatorId = `working-${Date.now()}`;
        $('#chat-body').append(
            `<div class="message-row d-flex justify-content-start" id="${indicatorId}">
                <div class="message-bubble agent-bubble working-bubble">
                    <div class="message-sender">Agent</div>
                    <div class="message-content working-content">
                        Working<span class="dot-anim"><span>.</span><span>.</span><span>.</span></span>
                    </div>
                    <div class="working-progress-bar indeterminate">
                        <div class="working-progress-bar-fill"></div>
                    </div>
                    <div class="working-progress-bar-label"></div>
                    <div class="working-progress-wrap d-none">
                        <div class="working-progress-title">Test Progress</div>
                        <ul class="working-progress-list mb-0"></ul>
                    </div>
                </div>
            </div>`
        );
        $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);
        return indicatorId;
    }

    function removeWorkingIndicator(indicatorId) {
        $(`#${indicatorId}`).remove();
    }

    function forceScrollToLatest(indicatorId) {
        const chatBody = $('#chat-body')[0];
        const progressList = $(`#${indicatorId} .working-progress-list`)[0];

        const doScroll = function() {
            if (progressList) {
                progressList.scrollTop = progressList.scrollHeight;
            }
            if (chatBody) {
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        };

        // Multiple passes make it robust when layout grows after markdown/tool-step rendering.
        doScroll();
        requestAnimationFrame(doScroll);
        setTimeout(doScroll, 0);
        setTimeout(doScroll, 60);
    }

    function progressLineClass(text) {
        const t = text || '';
        if (t.includes('[Session tokens')) return 'progress-line progress-cost progress-cost-total';
        if (t.includes('[Tokens')) return 'progress-line progress-cost';
        if (t.includes('[Thinking')) return 'progress-line progress-thinking';
        if (t.includes('[Planning')) return 'progress-line progress-status';
        if (t.includes('[Runner')) return 'progress-line progress-runner';
        if (t.includes('[Context')) return 'progress-line progress-context';
        return 'progress-line';
    }

    // Turn a status line into a short human message for the working bubble.
    function friendlyStatus(text) {
        const m = (text || '').trim().match(/^\[(Planning|Runner|Context)\]\s*(.*)$/);
        if (!m) return null;
        return (m[2] || m[1]).trim();
    }

    // Reflect the latest planning/runner status as the working bubble's main text.
    function updateWorkingStatus(indicatorId, text) {
        const s = friendlyStatus(text);
        if (!s) return;
        const el = $(`#${indicatorId} .working-content`);
        if (el.length) {
            el.html(
                `${escapeHtml(s)}` +
                '<span class="dot-anim"><span>.</span><span>.</span><span>.</span></span>'
            );
        }
    }

    // A progress line is a token/cost line we also echo at the top of the reply.
    function isTokenLine(text) {
        const t = text || '';
        return t.includes('[Tokens') || t.includes('[Session tokens');
    }

    // Pull the latest "total ≈ $X" figure out of a session-token line, if present.
    function extractSessionCost(text) {
        const m = (text || '').match(/total\s*\u2248?\s*\$([0-9]+\.[0-9]+)/i);
        return m ? m[1] : null;
    }

    function updateCostBadge(indicatorId, text) {
        const cost = extractSessionCost(text);
        if (!cost) return;
        const title = $(`#${indicatorId} .working-progress-title`);
        if (title.length) {
            title.html(`Test Progress <span class="cost-badge">Session ≈ $${cost}</span>`);
        }
    }

    // Render a token-info block (used at the top of an agent reply bubble).
    function buildTokenInfoBlock(tokenLines) {
        if (!tokenLines || !tokenLines.length) return '';
        const rows = tokenLines
            .map(l => `<div class="${progressLineClass(l)}">${escapeHtml(l)}</div>`)
            .join('');
        return `<div class="reply-token-info">${rows}</div>`;
    }

    // Agent reply bubble with the token/cost info shown at the bottom of the block.
    function appendAgentReply(text, tokenLines) {
        const contentHtml = renderMessageContent('Agent', text);
        const tokensHtml = buildTokenInfoBlock(tokenLines);
        $('#chat-body').append(
            `<div class="message-row d-flex justify-content-start">
                <div class="message-bubble agent-bubble">
                    <div class="message-sender">Agent</div>
                    <div class="message-content">${contentHtml}</div>
                    ${tokensHtml}
                </div>
            </div>`
        );
        $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);
    }

    // Drive the progress bar: determinate on "[Progress] d/t", indeterminate
    // (animated) while planning before any step counts arrive.
    function updateProgressBar(indicatorId, text) {
        const bar = $(`#${indicatorId} .working-progress-bar`);
        if (!bar.length) return;
        const fill = bar.find('.working-progress-bar-fill');
        const label = $(`#${indicatorId} .working-progress-bar-label`);
        const m = (text || '').match(/\[Progress\]\s*(\d+)\s*\/\s*(\d+)/);
        if (m) {
            const done = parseInt(m[1], 10);
            const total = Math.max(1, parseInt(m[2], 10));
            const pct = Math.min(100, Math.round((done / total) * 100));
            bar.removeClass('indeterminate').addClass('has-progress');
            fill.css('width', pct + '%');
            label.text(`${done}/${total} steps (${pct}%)`);
            return;
        }
        // Keep the animated bar while still planning (no counts yet).
        if (!bar.hasClass('has-progress') && friendlyStatus(text)) {
            bar.addClass('indeterminate');
        }
    }

    function appendProgressLine(indicatorId, text) {
        updateProgressBar(indicatorId, text);
        // Progress markers drive the bar only — don't clutter the step list.
        if ((text || '').includes('[Progress]')) {
            return;
        }
        const row = $(`#${indicatorId}`);
        const wrap = row.find('.working-progress-wrap');
        const list = row.find('.working-progress-list');
        if (!wrap.length || !list.length) {
            return;
        }
        wrap.removeClass('d-none');
        list.append(`<li class="${progressLineClass(text)}">${escapeHtml(text)}</li>`);
        updateCostBadge(indicatorId, text);
        updateWorkingStatus(indicatorId, text);
        forceScrollToLatest(indicatorId);
    }

    function normalizeProgressItem(item) {
        if (typeof item === 'string') {
            return { timestamp: '', text: item };
        }
        return {
            timestamp: item.timestamp || '',
            text: item.text || '',
        };
    }

    function formatProgressLine(item) {
        const prefix = item.timestamp ? `[${item.timestamp}] ` : '';
        return `${prefix}${item.text}`;
    }

    function buildHistoryCard(run) {
        const statusClass = run.status === 'done' ? 'status-done' : 'status-error';
        const safePrompt = escapeHtml(run.user_text || '(no prompt)');
        const progress = run.progress || [];
        const visible = progress.filter(p => {
            const item = normalizeProgressItem(p);
            return !(item.text || '').includes('[Progress]');
        });
        const stepsHtml = visible.length
            ? visible.map(p => {
                const item = normalizeProgressItem(p);
                const line = formatProgressLine(item);
                return `<li class="${progressLineClass(item.text)}">${escapeHtml(line)}</li>`;
            }).join('')
            : '<li>No tool-step logs captured.</li>';

        const finalSummary = run.status === 'done'
            ? `<div class="timeline-final"><strong>Final Reply:</strong> ${escapeHtml((run.reply || '').slice(0, 300))}${(run.reply || '').length > 300 ? '...' : ''}</div>`
            : `<div class="timeline-final"><strong>Error:</strong> ${escapeHtml(run.error || 'Unknown error')}</div>`;

        return `
            <details class="timeline-item">
                <summary>
                    <span class="timeline-status ${statusClass}">${escapeHtml(run.status || 'unknown')}</span>
                    <span class="timeline-meta">${escapeHtml(run.started_at || '')}</span>
                    <span class="timeline-prompt">${safePrompt}</span>
                </summary>
                <div class="timeline-body">
                    <div class="timeline-range">${escapeHtml(run.started_at || '')} -> ${escapeHtml(run.ended_at || '')}</div>
                    <ul class="timeline-steps mb-2">${stepsHtml}</ul>
                    ${finalSummary}
                </div>
            </details>
        `;
    }

    function renderHistory(history) {
        const list = $('#timeline-list');
        list.empty();
        if (!history || history.length === 0) {
            $('#timeline-empty').removeClass('d-none');
            return;
        }

        $('#timeline-empty').addClass('d-none');
        history.forEach(run => {
            list.append(buildHistoryCard(run));
        });
    }

    function loadHistory() {
        $.ajax({
            url: '/chat_history',
            method: 'GET',
            success: function(data) {
                renderHistory(data.history || []);
            },
            error: function() {
                renderHistory([]);
            }
        });
    }

    function pollChatStatus(requestId, indicatorId) {
        let shownProgress = 0;
        let consecutiveErrors = 0;
        const tokenLines = [];  // token/cost lines to echo atop the final reply
        const MAX_POLL_RETRIES = 10;

        const tick = function() {
            $.ajax({
                url: `/chat_status/${requestId}`,
                method: 'GET',
                timeout: 15000,
                success: function(data) {
                    consecutiveErrors = 0;

                    const progress = data.progress || [];
                    for (let i = shownProgress; i < progress.length; i++) {
                        const item = normalizeProgressItem(progress[i]);
                        const line = formatProgressLine(item);
                        appendProgressLine(indicatorId, line);
                        if (isTokenLine(item.text)) {
                            tokenLines.push(line);
                        }
                    }
                    shownProgress = progress.length;

                    if (data.status === 'running') {
                        forceScrollToLatest(indicatorId);
                    }

                    if (data.status === 'done') {
                        removeWorkingIndicator(indicatorId);
                        appendAgentReply(data.reply || 'Done.', tokenLines);
                        setPendingState(false);
                        loadHistory();
                        return;
                    }

                    if (data.status === 'error') {
                        removeWorkingIndicator(indicatorId);
                        appendAgentReply(`Error: ${data.error || 'Unknown server error.'}`, tokenLines);
                        setPendingState(false);
                        loadHistory();
                        return;
                    }

                    setTimeout(tick, 700);
                },
                error: function() {
                    consecutiveErrors++;
                    if (consecutiveErrors < MAX_POLL_RETRIES) {
                        const retryDelay = Math.min(1000 * consecutiveErrors, 5000);
                        appendProgressLine(indicatorId,
                            `<span style="color:#ff9800;">[Connection retry ${consecutiveErrors}/${MAX_POLL_RETRIES}...]</span>`);
                        setTimeout(tick, retryDelay);
                    } else {
                        removeWorkingIndicator(indicatorId);
                        appendMessage('Agent', 'Error: Could not read live test progress from server after multiple retries.');
                        setPendingState(false);
                    }
                }
            });
        };

        tick();
    }

    $('#txt-file-input').on('change', function() {
        const file = this.files && this.files[0] ? this.files[0] : null;
        $('#txt-file-name').text(file ? file.name : 'No file selected');
    });

    $('#chat-form').on('submit', function(e) {
        e.preventDefault();
        const userInput = $('#user-input').val().trim();
        const txtFile = $('#txt-file-input')[0].files[0];

        if (!userInput && !txtFile) {
            return;
        }

        if (txtFile && !txtFile.name.toLowerCase().endsWith('.txt')) {
            appendMessage('Agent', 'Error: Only .txt files are supported for upload.');
            return;
        }

        const userPreview = txtFile ? `${userInput || '(Uploaded txt file only)'} [Attached: ${txtFile.name}]` : userInput;

        appendMessage('You', userPreview);
        $('#user-input').val('');
        setPendingState(true);
        const indicatorId = addWorkingIndicator();

        const formData = new FormData();
        formData.append('message', userInput);
        if (txtFile) {
            formData.append('txt_file', txtFile);
        }

        $.ajax({
            url: '/chat',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(data) {
                if (!data.request_id) {
                    removeWorkingIndicator(indicatorId);
                    appendMessage('Agent', 'Error: Missing request id from server.');
                    setPendingState(false);
                    return;
                }
                $('#txt-file-input').val('');
                $('#txt-file-name').text('No file selected');
                pollChatStatus(data.request_id, indicatorId);
            },
            error: function(xhr) {
                removeWorkingIndicator(indicatorId);
                const serverMsg = xhr?.responseJSON?.error;
                appendMessage('Agent', `Error: ${serverMsg || 'Could not reach server.'}`);
                setPendingState(false);
            }
        });
    });

    $(document).on('click', '#timeline-refresh', function(e) {
        e.preventDefault();
        e.stopPropagation();
        loadHistory();
    });

    function attachActiveTask(attempt) {
        attempt = attempt || 0;
        $.ajax({
            url: '/active_request',
            method: 'GET',
            success: function(data) {
                if (!data || !data.request_id) {
                    if (attempt < 90) {
                        setTimeout(function() { attachActiveTask(attempt + 1); }, 2000);
                    }
                    return;
                }
                appendMessage('You', data.user_text || '[Auto-resume after reboot]');
                setPendingState(true);
                const indicatorId = addWorkingIndicator();
                pollChatStatus(data.request_id, indicatorId);
            }
        });
    }

    loadHistory();
    attachActiveTask();
});
</script>

<script>
/* ── Animated hex-grid background ── */
(function() {
    const canvas = document.getElementById('hex-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, nodes, animFrame;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        buildNodes();
    }

    function buildNodes() {
        nodes = [];
        const spacing = 90;
        for (let x = 0; x < W + spacing; x += spacing) {
            for (let y = 0; y < H + spacing; y += spacing * 0.866) {
                const offset = (Math.floor(y / (spacing * 0.866)) % 2) * (spacing / 2);
                nodes.push({
                    x: x + offset,
                    y,
                    pulse: Math.random() * Math.PI * 2,
                    speed: 0.006 + Math.random() * 0.01,
                    active: Math.random() > 0.72,
                });
            }
        }
    }

    function drawHex(x, y, r, alpha) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = (Math.PI / 3) * i - Math.PI / 6;
            const px = x + r * Math.cos(a);
            const py = y + r * Math.sin(a);
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.strokeStyle = `rgba(0, 113, 197, ${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
    }

    function isRunning() {
        return document.body.classList.contains('agent-running');
    }

    function draw(ts) {
        ctx.clearRect(0, 0, W, H);
        const running = isRunning();
        const boost = running ? 2.4 : 1;

        nodes.forEach(n => {
            n.pulse += n.speed * boost;
            const glow = (Math.sin(n.pulse) + 1) / 2;
            if (n.active) {
                const r = running ? 32 : 28;
                drawHex(n.x, n.y, r, 0.06 + glow * (running ? 0.32 : 0.14));
                if (glow > 0.78) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = running
                        ? `rgba(0, 199, 253, ${glow * 0.9})`
                        : `rgba(0, 113, 197, ${glow * 0.55})`;
                    ctx.fill();
                }
            } else {
                drawHex(n.x, n.y, 28, 0.03 + glow * 0.04);
            }
        });

        animFrame = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw(0);
})();
</script>
</body>
</html>
